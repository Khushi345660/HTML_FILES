<!DOCTYPE html>
<html>
<head>
    <title>Multimedia</title>
</head>

<body>

<h1>Multimedia Example</h1>

<h2>Image</h2>

<img src="a.jpg" width="300">

<h2>Audio</h2>

<audio controls>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<h2>Video</h2>

<video width="400" controls>
    <source src="video.mp4" type="video/mp4">
</video>

</body>
</html>
