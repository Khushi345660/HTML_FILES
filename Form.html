<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>

<body>

<h1>Student Form</h1>

<form>

<br><br>

<input type="email">

<br><br>

<label>Password:</label>

<br><br>

    <option>MCA</option>
    <option>MBA</option>
    <option>BCA</option>
</select>

<br><br>

<input type="submit" value="Submit">

</form>

</body>
</html>
