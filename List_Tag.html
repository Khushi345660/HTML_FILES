<!DOCTYPE html>
<html>
<head>
    <title>List Tag</title>
</head>

<body>

<h1>My Hobbies</h1>

<h2>Unordered List</h2>

<ul>
    <li>Reading</li>
    <li>Music</li>
    <li>Travel</li>
</ul>

<h2>Ordered List</h2>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

</body>
</html>
